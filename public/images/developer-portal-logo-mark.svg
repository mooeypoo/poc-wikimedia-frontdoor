<svg viewBox="-16 -16 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
	<!--
		Source: https://upload.wikimedia.org/wikipedia/commons/8/8b/Wikimedia-logo_black.svg
		Black fills/strokes remapped to currentColor for light/dark mode.
		Prefer the inlined {@link WikimediaLogoMark} Vue component in the shell —
		<img> cannot inherit currentColor.
	-->
	<clipPath id="wikimedia-logo-mark-clip">
		<path d="m1-2v12h-2v-12l-15-15v33h32v-33z"/>
	</clipPath>
	<g clip-path="url(#wikimedia-logo-mark-clip)">
		<circle r="9" fill="currentColor"/>
		<circle fill="none" r="13" stroke="currentColor" stroke-width="4"/>
	</g>
	<circle cy="-10" r="5" fill="currentColor"/>
</svg>
